      <aside class="inspector"><nav class="inspector-tabs"><button class="inspector-tab">属性</button><button class="inspector-tab">布局</button><button class="inspector-tab">结构</button><button class="inspector-tab active">通信</button></nav><div class="selection"><span class="selection-icon"><i data-lucide="type" id="selectionIcon"></i></span><div class="selection-copy"><b id="selectionName">温度文本</b><small id="selectionId">component.temperature</small></div></div><section class="panel-view active" id="bindingPanel"><div class="section-title">组件属性</div><div class="binding-list" id="bindingRows"></div><footer class="inspector-foot"><span class="dot"></span><span id="bindingCount">1 个属性已绑定</span></footer></section><section class="panel-view" id="dataPickerPanel"><header class="picker-head"><button class="back-button" id="pickerBack" title="返回通信"><i data-lucide="arrow-left"></i></button><div class="picker-head-copy"><b id="pickerTitle">绑定“文字内容”</b><small id="pickerComponent">温度文本</small></div></header><div class="picker-tools"><label class="picker-search"><i data-lucide="search"></i><input id="pickerSearch" placeholder="搜索名称、路径或当前值"></label><button class="button primary" id="pickerSearchButton"><i data-lucide="search"></i>搜索</button></div><select class="picker-filter" id="pickerSourceFilter"><option value="all">全部连接</option></select><div class="direct-data-list" id="directDataList"></div></section></aside>
    </section>
  </div>
  <div class="toast" id="toast">操作完成</div>

  <script>
    const sources=[
      {id:'http',name:'能源接口',protocol:'HTTP',endpoint:'https://energy-gateway/api/v1/realtime',status:'正常',latency:'86 ms',kind:'json',summary:'200 OK · 刚刚'},
      {id:'mqtt',name:'车间设备',protocol:'MQTT',endpoint:'mqtt://10.20.1.18:1883',status:'正常',latency:'18 ms',kind:'json',summary:'监听中 · 刚刚'},
      {id:'mysql',name:'生产数据库',protocol:'MySQL',endpoint:'10.20.3.11:3306 / production',status:'正常',latency:'24 ms',kind:'sql',summary:'3 个查询'},
      {id:'sql',name:'质量数据库',protocol:'SQL Server',endpoint:'10.20.3.21:1433 / quality',status:'延迟',latency:'610 ms',kind:'sql',summary:'2 个查询'},
      {id:'redis',name:'告警缓存',protocol:'Redis',endpoint:'10.20.4.16:6379 / db 2',status:'正常',latency:'5 ms',kind:'json',summary:'订阅中 · 刚刚'},
      {id:'socket',name:'PLC Socket 网关',protocol:'Socket',endpoint:'10.20.2.30:9001',status:'异常',latency:'超时',kind:'json',summary:'2 分钟前中断'}
    ];
    const dataFields=[
      {id:'power',source:'http',name:'power',label:'瞬时功率',value:'482.6 kW',raw:'482.6',type:'number',path:'$.data.realtime.power',group:'data.realtime'},
      {id:'loadRate',source:'http',name:'loadRate',label:'负载率',value:'0.768',raw:'0.768',type:'number',path:'$.data.realtime.loadRate',group:'data.realtime'},
      {id:'monthTotal',source:'http',name:'total',label:'月度能耗',value:'28,410 kWh',raw:'28410',type:'number',path:'$.data.month.total',group:'data.month'},
      {id:'energyAlarms',source:'http',name:'alarms',label:'能耗告警',value:'Array(3)',raw:'[{...}]',type:'array',path:'$.data.alarms',group:'data'},
      {id:'temperature',source:'mqtt',name:'temperature',label:'设备温度',value:'36.5 °C',raw:'36.5',type:'number',path:'$.data.temperature',group:'data'},
      {id:'runStatus',source:'mqtt',name:'status',label:'运行状态',value:'running',raw:'"running"',type:'string',path:'$.data.status',group:'data'},
      {id:'rpm',source:'mqtt',name:'rpm',label:'设备转速',value:'1,486 rpm',raw:'1486',type:'number',path:'$.data.rpm',group:'data'},
      {id:'alarmCount',source:'redis',name:'count',label:'当前告警数量',value:'6',raw:'6',type:'number',path:'$.alarm.current.count',group:'alarm.current'},
      {id:'alarmLevel',source:'redis',name:'level',label:'最高告警等级',value:'2',raw:'2',type:'number',path:'$.alarm.current.level',group:'alarm.current'},
      {id:'plcStatus',source:'socket',name:'status',label:'PLC 在线状态',value:'false',raw:'false',type:'boolean',path:'$.payload.online',group:'payload'},
      {id:'passRate',source:'sql',name:'passRate',label:'质量合格率',value:'98.72%',raw:'98.72',type:'number',path:'query.quality.passRate',group:'query'}
    ];
    const datasets=[
      {id:'productionRows',source:'mysql',name:'今日生产记录',value:'12,680,420 行',type:'分页数据',path:'query.production.today · 100 条/页'},
      {id:'deviceLedger',source:'mysql',name:'设备台账',value:'18,420 行',type:'分页数据',path:'query.device.ledger · 100 条/页'},
      {id:'shiftSummary',source:'mysql',name:'班次产量统计',value:'24 条',type:'聚合数据',path:'query.shift.summary'},
      {id:'qualityRows',source:'sql',name:'质量检测记录',value:'8,760,350 行',type:'分页数据',path:'query.quality.rows · 100 条/页'}
    ];
    const components={
      temperature:{name:'温度文本',id:'component.temperature',icon:'type',rows:[{key:'text',label:'文字内容',local:'36.5 °C',target:'scalar',data:'temperature'},{key:'color',label:'字体颜色',local:'#1e6558',target:'scalar',data:null},{key:'visible',label:'是否显示',local:'显示',target:'scalar',data:null}]},
      table:{name:'生产记录表格',id:'component.productionTable',icon:'table-2',rows:[{key:'tableData',label:'表格数据',local:'静态 4 行',target:'dataset',data:'productionRows'},{key:'title',label:'标题文本',local:'今日生产记录',target:'scalar',data:null},{key:'borderColor',label:'边框颜色',local:'#ccd9dc',target:'scalar',data:null}]}
    };
    let selectedSource='http',responseMode='tree',selectedComponent='temperature',bindingKey=null;
    const $=id=>document.getElementById(id),short=p=>({'SQL Server':'SQL',MySQL:'MYSQL',Socket:'TCP'}[p]||p.toUpperCase()),statusClass=s=>s==='正常'?'':s==='延迟'?'warn':'bad',sourceById=id=>sources.find(source=>source.id===id),fieldById=id=>dataFields.find(field=>field.id===id),datasetById=id=>datasets.find(item=>item.id===id);
    function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
    function renderSources(){const query=$('sourceSearch').value.trim().toLowerCase();$('sourceList').innerHTML=sources.filter(source=>!query||[source.name,source.protocol,source.endpoint].some(value=>String(value).toLowerCase().includes(query))).map(source=>`<button class="source-item ${selectedSource===source.id?'active':''}" data-source="${source.id}"><span class="protocol">${short(source.protocol)}</span><span class="source-copy"><b>${source.name}</b><small>${source.summary}</small></span><span class="dot ${statusClass(source.status)}"></span></button>`).join('');$('sourceList').querySelectorAll('[data-source]').forEach(button=>button.addEventListener('click',()=>selectSource(button.dataset.source)))}
    function selectSource(id){selectedSource=id;const source=sourceById(id);$('sourceTitle').textContent=source.name;$('sourceProtocol').textContent=source.protocol;$('sourceEndpoint').textContent=source.endpoint;$('sourceStatus').innerHTML=`<span class="dot ${statusClass(source.status)}"></span>${source.status} · ${source.latency}`;responseMode=source.kind==='sql'?'table':'tree';showTab('response');renderSources();renderResponse();renderConfig();lucide.createIcons()}
    function showTab(tab){document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab));$('responsePane').classList.toggle('active',tab==='response');$('configPane').classList.toggle('active',tab==='config')}
    function renderResponse(){const source=sourceById(selectedSource);if(source.kind==='sql')renderSql(source);else renderJson(source);lucide.createIcons()}
    function renderJson(source){const isHttp=source.protocol==='HTTP';$('requestArea').innerHTML=`<div class="request-bar"><button class="method">${isHttp?'GET':source.protocol}</button><div class="request-input">${isHttp?source.endpoint:source.protocol==='MQTT'?'factory/line1/+/telemetry':source.endpoint}</div><button class="button primary" id="sendRequest"><i data-lucide="${isHttp?'send':'radio'}"></i>${isHttp?'发送':'获取最新'}</button></div>`;$('sendRequest').addEventListener('click',()=>toast(isHttp?'请求成功：200 OK':'已获取最新消息'));$('responseTitle').textContent=isHttp?'响应数据':'最新消息';$('responseMeta').innerHTML=`<span class="response-ok">${source.status==='正常'?(isHttp?'200 OK':'实时'):'异常'}</span> · ${source.latency} · ${isHttp?'1.8 KB':'刚刚'}`;$('viewSwitch').innerHTML=`<button class="view-button ${responseMode==='tree'?'active':''}" data-view="tree">JSON 树</button><button class="view-button ${responseMode==='raw'?'active':''}" data-view="raw">原始 JSON</button>`;$('viewSwitch').querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{responseMode=button.dataset.view;renderResponse()}));const fields=dataFields.filter(field=>field.source===source.id);if(responseMode==='raw'){$('responseBody').innerHTML=`<pre class="json-raw">${rawJsonFor(source.id)}</pre>`}else{let currentGroup='';$('responseBody').innerHTML=`<div class="json-head"><div>字段</div><div>当前值</div><div>类型</div><div>JSON 路径</div></div>`+fields.map(field=>{let group='';if(field.group!==currentGroup){currentGroup=field.group;group=`<div class="json-row group"><div class="json-key" style="--depth:0"><i data-lucide="chevron-down"></i><b>${field.group}</b></div><div>{ }</div><div>object</div><div></div></div>`}return group+`<div class="json-row"><div class="json-key" style="--depth:1"><i data-lucide="corner-down-right"></i><b>${field.name}</b></div><div class="json-value">${field.value}</div><div><span class="json-type">${field.type}</span></div><div class="json-path">${field.path}</div></div>`}).join('')}$('responseFooter').innerHTML=''}
    function rawJsonFor(sourceId){if(sourceId==='http')return `{
  "status": 200,
  "data": {
    "realtime": { "power": 482.6, "loadRate": 0.768 },
    "month": { "total": 28410 },
    "alarms": [{ "level": 2 }, { "level": 1 }, { "level": 1 }]
  }
}`;if(sourceId==='mqtt')return `{
  "topic": "factory/line1/fan01/telemetry",
  "data": { "temperature": 36.5, "status": "running", "rpm": 1486 }
}`;if(sourceId==='redis')return `{
  "alarm": { "current": { "count": 6, "level": 2 } }
}`;return `{
  "payload": { "online": false }
}`}
    function renderSql(source){$('requestArea').innerHTML=`<div class="sql-tools"><select class="sql-query"><option>${source.id==='mysql'?'今日生产记录':'质量检测记录'}</option><option>${source.id==='mysql'?'设备台账':'质量合格率'}</option></select><input class="sql-keyword" placeholder="设备名称或编号"><select class="sql-state"><option>全部状态</option><option>运行</option><option>待机</option></select><button class="button primary" id="runQuery"><i data-lucide="search"></i>查询</button></div>`;$('runQuery').addEventListener('click',()=>toast('已查询第 1 页，共返回 100 条'));$('responseTitle').textContent='查询结果';$('responseMeta').innerHTML=`<span class="response-ok">${source.status}</span> · ${source.id==='mysql'?'12,680,420':'8,760,350'} 行 · ${source.latency}`;$('viewSwitch').innerHTML=`<button class="view-button ${responseMode==='table'?'active':''}" data-view="table">表格</button><button class="view-button ${responseMode==='sqljson'?'active':''}" data-view="sqljson">JSON</button>`;$('viewSwitch').querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{responseMode=button.dataset.view;renderResponse()}));if(responseMode==='sqljson'){$('responseBody').innerHTML=`<pre class="json-raw">{
  "items": [
    { "id": 98261, "device": "灌装机 01", "status": "running", "output": 1286 },
    { "id": 98260, "device": "包装机 03", "status": "running", "output": 986 }
  ],
  "page": { "pageSize": 100, "nextCursor": "2026-08-02T10:29:58_98260", "hasMore": true }
}</pre>`}else{$('responseBody').innerHTML=`<div class="sql-table"><div class="sql-row head"><div>ID</div><div>设备名称</div><div>状态</div><div>产量</div><div>时间</div></div><div class="sql-row"><div>98261</div><div>灌装机 01</div><div><span class="state">运行</span></div><div>1,286</div><div>2026-08-02 10:30:00</div></div><div class="sql-row"><div>98260</div><div>包装机 03</div><div><span class="state">运行</span></div><div>986</div><div>2026-08-02 10:29:58</div></div><div class="sql-row"><div>98259</div><div>检测机 02</div><div><span class="state idle">待机</span></div><div>742</div><div>2026-08-02 10:29:51</div></div><div class="sql-row"><div>98258</div><div>输送线 01</div><div><span class="state">运行</span></div><div>2,104</div><div>2026-08-02 10:29:46</div></div><div class="sql-row"><div>98257</div><div>贴标机 04</div><div><span class="state">运行</span></div><div>832</div><div>2026-08-02 10:29:41</div></div></div>`}$('responseFooter').innerHTML=`<footer class="paging"><span>每页 100 条 · 使用游标加载下一页</span><div class="paging-controls"><button class="page-button">‹</button><button class="page-button active">1</button><button class="page-button">2</button><button class="page-button">›</button></div></footer>`}
    function renderConfig(){const source=sourceById(selectedSource),isSql=source.kind==='sql';$('configContent').innerHTML=`<section class="config-section"><h3>基础信息</h3><div class="config-grid"><div class="field"><label>连接名称</label><div class="input">${source.name}</div></div><div class="field"><label>协议类型</label><div class="input disabled">${source.protocol}</div></div><div class="field full"><div class="enable"><div><b>启用连接</b><span>停用后不再请求或接收数据</span></div><button class="switch" aria-label="启用连接"></button></div></div></div></section><section class="config-section"><h3>${source.protocol} 设置</h3><div class="config-grid"><div class="field full"><label>${isSql?'数据库地址':'连接地址'}</label><div class="input">${source.endpoint}</div></div>${isSql?'<div class="field"><label>连接池</label><div class="input">最多 10 个连接</div></div><div class="field"><label>查询超时</label><div class="input">30 秒</div></div>':'<div class="field"><label>刷新频率</label><div class="input">5 秒</div></div><div class="field"><label>连接超时</label><div class="input">10 秒</div></div>'}</div></section>`}
    function showScene(id){document.querySelectorAll('.mode-button').forEach(button=>button.classList.toggle('active',button.dataset.scene===id));document.querySelectorAll('.scene').forEach(scene=>scene.classList.toggle('active',scene.id===id));showBindingPanel();lucide.createIcons()}
    function renderBindings(){const component=components[selectedComponent];$('selectionName').textContent=component.name;$('selectionId').textContent=component.id;$('selectionIcon').setAttribute('data-lucide',component.icon);$('bindingRows').innerHTML=component.rows.map(row=>{const item=row.data?(row.target==='dataset'?datasetById(row.data):fieldById(row.data)):null,source=item?sourceById(item.source):null;return `<article class="binding-row"><div class="binding-head"><b>${row.label}</b><button data-bind="${row.key}">${item?'更换':'选择数据'}</button></div><div class="local-value">属性值：${row.local}</div><div class="relation ${item?'bound':''}"><span class="target">${row.label}</span><i class="arrow" data-lucide="arrow-left"></i>${item?`<span class="bound-data"><b>${item.label||item.name}</b><small>${source.name} · ${item.path}</small></span>`:`<span class="not-bound">使用属性值</span>`}</div></article>`}).join('');const count=component.rows.filter(row=>row.data).length;$('bindingCount').textContent=`${count} 个属性已绑定`;$('bindingRows').querySelectorAll('[data-bind]').forEach(button=>button.addEventListener('click',()=>openDirectPicker(button.dataset.bind)));lucide.createIcons()}
    function selectComponent(id){selectedComponent=id;document.querySelectorAll('.canvas-component').forEach(component=>component.classList.toggle('selected',component.dataset.component===id));showBindingPanel();renderBindings()}
    function showBindingPanel(){$('bindingPanel').classList.add('active');$('dataPickerPanel').classList.remove('active')}
    function openDirectPicker(key){bindingKey=key;$('pickerSearch').value='';$('pickerSourceFilter').value='all';const component=components[selectedComponent],row=component.rows.find(item=>item.key===key);$('pickerTitle').textContent=`绑定“${row.label}”`;$('pickerComponent').textContent=component.name;$('bindingPanel').classList.remove('active');$('dataPickerPanel').classList.add('active');renderDirectData()}
    function compatibleData(){const component=components[selectedComponent],row=component.rows.find(item=>item.key===bindingKey),query=$('pickerSearch').value.trim().toLowerCase(),sourceFilter=$('pickerSourceFilter').value,list=row.target==='dataset'?datasets:dataFields;return list.filter(item=>(sourceFilter==='all'||item.source===sourceFilter)&&(!query||[item.label||item.name,item.name,item.value,item.path,sourceById(item.source).name].some(value=>String(value).toLowerCase().includes(query))))}
    function renderDirectData(){const items=compatibleData(),groups=[...new Set(items.map(item=>item.source))];$('directDataList').innerHTML=groups.map(sourceId=>{const source=sourceById(sourceId),rows=items.filter(item=>item.source===sourceId).map(item=>`<button class="direct-data" data-direct="${item.id}"><span class="direct-copy"><b>${item.label||item.name}</b><small>${item.path}</small></span><span class="direct-value">${item.value}</span></button>`).join('');return `<div class="data-group"><span class="tag">${short(source.protocol)}</span>${source.name}</div>${rows}`}).join('')||'<div class="empty">没有符合当前属性的数据</div>';$('directDataList').querySelectorAll('[data-direct]').forEach(button=>button.addEventListener('click',()=>bindDirectly(button.dataset.direct)));lucide.createIcons()}
    function bindDirectly(id){const component=components[selectedComponent],row=component.rows.find(item=>item.key===bindingKey);row.data=id;showBindingPanel();renderBindings();toast(`${row.label} 已绑定`)}
    $('pickerSourceFilter').innerHTML='<option value="all">全部连接</option>'+sources.map(source=>`<option value="${source.id}">${source.name} · ${source.protocol}</option>`).join('');document.querySelectorAll('.mode-button').forEach(button=>button.addEventListener('click',()=>showScene(button.dataset.scene)));document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>showTab(button.dataset.tab)));$('sourceSearch').addEventListener('input',renderSources);$('testConnection').addEventListener('click',()=>toast('连接测试成功'));$('saveConnection').addEventListener('click',()=>toast('连接设置已保存'));$('newConnection').addEventListener('click',()=>toast('打开新建连接'));document.querySelectorAll('.canvas-component').forEach(component=>component.addEventListener('click',()=>selectComponent(component.dataset.component)));$('pickerBack').addEventListener('click',showBindingPanel);$('pickerSearch').addEventListener('input',renderDirectData);$('pickerSearchButton').addEventListener('click',()=>toast(`找到 ${compatibleData().length} 项数据`));$('pickerSourceFilter').addEventListener('change',renderDirectData);
    renderSources();selectSource('http');renderBindings();if(window.lucide)lucide.createIcons();
  </script>
